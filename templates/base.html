<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Магазин{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }

        /* Шапка */
        .header { background: #1a1a2e; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header .logo { font-size: 22px; font-weight: bold; color: white; text-decoration: none; }
        .header a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .header a:hover { color: white; }
        .cart-btn { background: #e94560; color: white !important; padding: 7px 14px; border-radius: 4px; }
        .cart-btn:hover { background: #c73652 !important; }

        /* Основной контент */
        .container { max-width: 1100px; margin: 25px auto; padding: 0 20px; }

        /* Карточки товаров */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.12); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; }
        .product-card .no-img { width: 100%; height: 200px; background: #eee; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 40px; }
        .product-card .info { padding: 15px; }
        .product-card h3 { font-size: 15px; margin-bottom: 8px; }
        .product-card .price { font-size: 18px; font-weight: bold; color: #e94560; }
        .product-card .rating { color: #f5a623; font-size: 13px; margin: 5px 0; }
        .product-card .stock-out { color: #999; font-size: 12px; }
        .product-card .btn-small { display: block; margin-top: 10px; text-align: center; }

        /* Кнопки */
        .btn { display: inline-block; padding: 9px 18px; background: #1a1a2e; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #2d2d5e; }
        .btn-primary { background: #e94560; }
        .btn-primary:hover { background: #c73652; }
        .btn-outline { background: white; color: #1a1a2e; border: 1px solid #1a1a2e; }
        .btn-outline:hover { background: #1a1a2e; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 13px; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }

        /* Формы */
        .form-group { margin: 15px 0; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: Arial; }
        .form-control:focus { outline: none; border-color: #e94560; }
        textarea.form-control { resize: vertical; min-height: 90px; }
        .form-error { color: red; font-size: 12px; margin-top: 4px; }

        /* Карточка */
        .card { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }

        /* Категории */
        .categories { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .category-tag { padding: 6px 14px; border-radius: 20px; background: white; border: 1px solid #ddd; text-decoration: none; color: #555; font-size: 13px; }
        .category-tag:hover, .category-tag.active { background: #e94560; color: white; border-color: #e94560; }

        /* Таблица */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: bold; font-size: 13px; color: #666; }

        /* Бейдж */
        .badge { padding: 3px 9px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-new { background: #e8f5e9; color: #2e7d32; }
        .badge-processing { background: #fff3e0; color: #ef6c00; }
        .badge-shipped { background: #e3f2fd; color: #1565c0; }
        .badge-delivered { background: #f3e5f5; color: #6a1b9a; }

        /* Сообщения */
        .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 15px; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }

        /* Звезды рейтинга */
        .stars { color: #f5a623; }
        .star-input label { cursor: pointer; font-size: 24px; color: #ddd; }
        .star-input input:checked ~ label, .star-input label:hover,
        .star-input label:hover ~ label { color: #f5a623; }
    </style>
</head>
<body>
<div class="header">
    <a href="{% url 'product_list' %}" class="logo">🛒 ShopDjango</a>
    <div>
        {% if user.is_authenticated %}
            <span style="color: #aaa;">{{ user.username }}</span>
            <a href="{% url 'order_list' %}">Мои заказы</a>
            <a href="{% url 'cart' %}" class="cart-btn">🛒 Корзина</a>
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
            <a href="{% url 'cart' %}" class="cart-btn">🛒 Корзина</a>
        {% endif %}
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
